<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اختبار تدريبي - جروب المشتركين</title>
    <style>
      /* تعديل حاوية الكويز لتكون في المنتصف */
      #quiz {
        width: 100%;
        max-width: 600px;
        min-height: 70vh;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
      }
      @media (max-width: 600px) {
        body {
          padding: 10px;
        }

        #quiz {
          width: 100%;
          min-height: 80vh;
          margin: 0 auto;
          justify-content: center;
        }

        #question-container {
          width: 100%;
        }

        #question-container h2 {
          text-align: center;
          font-size: 25px;
          line-height: 1.7;
        }

        #quiz form {
          width: 100%;
        }

        #next-button {
          width: 100%;
          margin-top: 20px;
        }
      }
      /* إلغاء التثبيت في الزاوية وجعله تحت الأسئلة */
      #next-button {
        width: 120px;
        margin-top: 20px;
        margin-right: auto;
        margin-left: 0;
        padding: 10px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
        font-weight: bold;
        position: static;
      }

      /* تحسين شكل الخيارات عند الاختيار */
      input[type="radio"]:checked + label {
        background-color: #e7f1ff !important;
        border-color: #007bff !important;
      }
      body {
        font-family: Arial, sans-serif;
        direction: rtl;
        font-weight: 900;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        background-color: #f8f9fa;
        margin: 0;
        padding: 13px;
      }

      .header-box {
        background-color: #fff;
        border: 2px solid #28a745;
        border-radius: 15px;
        padding: 10px;
        margin-bottom: 20px;
        text-align: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      .header-box h1 {
        color: #28a745;
        font-size: 24px;
        margin-bottom: 10px;
      }
      .header-box p {
        color: #555;
        font-size: 18px;
        line-height: 1.6;
      }

      .links-container {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 15px;
        flex-wrap: wrap;
      }

      .btn-link {
        text-decoration: none;
        color: white;
        padding: 10px 20px;
        border-radius: 25px;
        font-size: 18px;
        transition: opacity 0.3s;
      }

      .tg-btn {
        background-color: #0088cc;
      }
      .fb-btn {
        background-color: #1877f2;
      }

      .hidden {
        display: none !important;
      }

      #login-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background-color: #ffffff;
        border: 2px solid #007bff;
        border-radius: 15px;
        box-shadow: 0 5px 25px rgba(0, 123, 255, 0.2);
        text-align: center;
      }

      #login-container input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
      }

      #login-container button {
        width: 100%;
        background-color: #007bff;
        color: white;
        padding: 12px 0;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      #timer {
        font-size: 20px;
        color: red;
        font-weight: bold;
      }
      #next-button {
        padding: 10px 30px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .correct-answer {
        color: green;
        font-weight: 900;
      }
      .wrong-answer {
        color: red;
        font-weight: 900;
      }

      .feedback-msg {
        font-size: 22px;
        margin: 15px 0;
        padding: 10px;
        border-radius: 10px;
        background: #f0fdf4;
        color: #166534;
        border: 1px dashed #28a745;
      }

      ul {
        list-style-type: none;
        padding: 0;
      }
      ul li {
        margin-bottom: 15px;
        background-color: #f0f4f8;
        padding: 15px;
        border-radius: 8px;
        border-right: 5px solid #007bff;
      }
    </style>
  </head>
  <body>
    <div id="info-header" class="header-box">
      <h1>🎁 هدية القناة العامة</h1>
      <p>
        هذا الاختبار هو جزء من تدريبات <b>جروب المشتركين للتدريب</b> علي اختبار
        الجهاز المركزي للتنظيم والإدارة.<br />
        تم فتحه مجاناً لجميع متابعينا. لمتابعة أحدث آراء الممتحنين والأسئلة
        يومياً، انضم إلينا عبر الروابط التالية:
      </p>
      <div class="links-container">
        <a
          href="https://www.facebook.com/share/p/1J118pxXnq/"
          class="btn-link fb-btn"
          >👥دوس هنا</a
        >
      </div>
    </div>

    <div id="login-container">
      <h2 style="margin-top: 0">بيانات الدخول</h2>
      <label>🔒 كلمة المرور (7):</label>
      <input id="password" type="password" placeholder="اكتب 7 بالانجليزي" />
      <label>⏳ مدة الاختبار (بالدقائق):</label>
      <input id="duration" type="number" value="5" min="1" />
      <button onclick="checkPassword()">🚀 ابدأ الاختبار الآن</button>
    </div>

    <div class="hidden" id="quiz">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          background: white;
          padding: 10px;
          border-radius: 10px;
          margin-bottom: 15px;
          gap: 30px;
        "
      >
        <div id="timer">5:00</div>
        <div id="question-info">السؤال 1 من 20</div>
      </div>
      <form id="quizForm">
        <div id="question-container"></div>
        <button id="next-button" onclick="nextQuestion(event)" type="button">
          التالي
        </button>
      </form>
    </div>

    <div class="hidden" id="result"></div>

    <script>
      const questions = [
        {
          question: "سرتُ صباحًا إلى المدرسة، أعرب كلمة صباحًا",
          options: ["ظرف مكان", "مفعول به", "ظرف زمان، مفعول فيه"],
          answer: "ظرف زمان، مفعول فيه",
        },
        {
          question: "ذاكرتُ حبًا في التفوق، أعرب كلمة حبًا",
          options: ["مفعول مطلق منصوب", "مفعول لأجله منصوب", "مفعول به منصوب"],
          answer: "مفعول لأجله منصوب",
        },
        {
          question: "اختر الجملة الصحيحة",
          options: ["اسلمي يا مصر", "إسلمي يا مصر"],
          answer: "اسلمي يا مصر",
        },
        {
          question: "اسلمي يا مصر، الفعل اسلمي فعل أمر مبني على",
          options: ["حذف النون", "السكون"],
          answer: "حذف النون",
        },
        {
          question: "حدد خبر كان في قوله تعالى: {وكان حقًا علينا نصر المؤمنين}",
          options: ["نصر", "حقًا", "محذوف"],
          answer: "حقًا",
        },
        {
          question: "لا الناهية",
          options: ["تنصب الفعل المضارع", "تجزم الفعل المضارع"],
          answer: "تجزم الفعل المضارع",
        },
        {
          question: "الاسم المفرد ينصب بـ",
          options: ["الضمة", "الفتحة", "الكسرة"],
          answer: "الفتحة",
        },
        {
          question: "كل الحروف",
          options: ["تبدأ بهمزة قطع", "تبدأ بهمزة قطع ما عدا (أل) التعريف"],
          answer: "تبدأ بهمزة قطع ما عدا (أل) التعريف",
        },
        {
          question: "أكرمت الطالبَ",
          options: ["العفيفةَ نفسُه", "العفيفةُ نفسُه"],
          answer: "العفيفةَ نفسُه",
        },
        {
          question: "أكرمت الطالبتين",
          options: ["العفيفتان نفسُهما", "العفيفتين نفسُهما"],
          answer: "العفيفتين نفسُهما",
        },
        {
          question: "التسامح ........ الإسلام",
          options: ["مبدء", "مبدأ"],
          answer: "مبدأ",
        },
        {
          question: "الزواج أساسه ........",
          options: ["التكافؤ", "التكافأ"],
          answer: "التكافؤ",
        },

        // 30
        {
          question: "أزيدٌ في المنزل أم ..........",
          options: ["عليٌ", "عليُّ", "عليٌّ"],
          answer: "عليٌّ",
        },
        {
          question: "ليس ترفع ..........",
          options: ["المبتدأ", "الخبر"],
          answer: "المبتدأ",
        },
        {
          question: "ليس تنصب ..........",
          options: ["المبتدأ", "الخبر"],
          answer: "الخبر",
        },
        {
          question: "طلاب المعهد متفوقون، أعرب كلمة (المعهد)",
          options: [
            "خبر مرفوع وعلامة رفعه الضمة",
            "مضاف إليه مجرور وعلامة جره الكسرة",
          ],
          answer: "مضاف إليه مجرور وعلامة جره الكسرة",
        },
        {
          question: "صمتُ شهرًا، أعرب كلمة (شهرًا)",
          options: [
            "خبر مرفوع وعلامة رفعه الضمة",
            "ظرف مكان منصوب وعلامة نصبه الفتحة",
            "ظرف زمان منصوب وعلامة نصبه الفتحة",
          ],
          answer: "ظرف زمان منصوب وعلامة نصبه الفتحة",
        },
        {
          question: "تصنف علامات الإعراب الأصلية من حيث القوة تنازليًا",
          options: ["الكسرة، الضمة، الفتحة", "الضمة، الكسرة، الفتحة"],
          answer: "الكسرة، الضمة، الفتحة",
        },
        {
          question: "جاء كلا الرجلين، أعرب كلمة (كلا)",
          options: [
            "فاعل مرفوع وعلامة رفعه الضمة الظاهرة",
            "فاعل مرفوع وعلامة رفعه الضمة المقدرة",
          ],
          answer: "فاعل مرفوع وعلامة رفعه الضمة المقدرة",
        },
        {
          question: "هل جملة (الطلاب يفوزون) بها فعل من الأفعال الخمسة؟",
          options: ["نعم", "لا"],
          answer: "نعم",
        },
        {
          question: "فازَ الطلابُ في المسابقة، (في المسابقة) ..........",
          options: ["جار ومجرور", "مفعول به"],
          answer: "جار ومجرور",
        },
        {
          question: "تالله لينجحنَّ المجتهد، أعرب كلمة (ينجحن)",
          options: ["فعل مضارع مبني على السكون", "فعل مضارع مبني على الفتح"],
          answer: "فعل مضارع مبني على الفتح",
        },
        {
          question: "اختر الجملة الصحيحة",
          options: ["يا طالبَ العلمِ", "يا طالبُ العلمِ", "يا طالبِ العلمِ"],
          answer: "يا طالبَ العلمِ",
        },
        {
          question: "الحمد لله فاطر السماوات، حدد نوع الخبر",
          options: ["مفرد", "جملة", "شبه جملة"],
          answer: "شبه جملة",
        },
        // 31

        {
          question: "الحال دائمًا .............",
          options: ["منصوب", "مجرور", "مرفوع"],
          answer: "منصوب",
        },
        {
          question: "اختر الإجابة الصحيحة",
          options: ["حضرَ الوفاةُ الموتى", "حضرَ الموتى الوفاةُ"],
          answer: "حضرَ الموتى الوفاةُ",
        },
        {
          question: "حدد الحرف الناسخ",
          options: ["لم", "لما", "إنَّ", "لا"],
          answer: "إنَّ",
        },
        {
          question: "ظننتُ الوقتَ فجرًا",
          options: [
            "فعل ناسخ، تاء الفاعل، مفعول به أول، مفعول به ثان",
            "فعل ناسخ، تاء التأنيث، فاعل مرفوع، مفعول به",
          ],
          answer: "فعل ناسخ، تاء الفاعل، مفعول به أول، مفعول به ثان",
        },
        {
          question: "في الكون آيات للعالمين، حدد الخبر",
          options: ["في الكون", "آيات", "للعالمين"],
          answer: "في الكون",
        },
        {
          question: "إذا كان الظرف غير منون، يعرب الاسم بعده .............",
          options: ["حسب موقعه في الجملة", "مضاف إليه مجرور"],
          answer: "مضاف إليه مجرور",
        },
        {
          question:
            "إذا كان الظرف منونًا بالفتح، يعرب الاسم بعده .............",
          options: ["حسب موقعه في الجملة", "مضاف إليه مجرور"],
          answer: "حسب موقعه في الجملة",
        },
        {
          question: "سلمتُ على طالبين متفوقين، أعرب كلمة متفوقين",
          options: ["خبر", "نعت", "حال"],
          answer: "نعت",
        },
        {
          question: "اختر الجملة الصحيحة",
          options: ["بنى المهندسون الجسر", "بنوا المهندسين الجسر"],
          answer: "بنى المهندسون الجسر",
        },
        {
          question:
            "الفلاحون يحرثون الأرض، هل الجملة بها فعل من الأفعال الخمسة؟",
          options: ["نعم", "لا"],
          answer: "نعم",
        },
        {
          question: "قرأتُ الكتابَ ...........",
          options: ["ثلثُه", "ثلثَه"],
          answer: "ثلثَه",
        },
        {
          question: "اختر الجملة الصحيحة",
          options: ["مصرُ بلدٍ محبةٍ للسلامِ", "مصرُ بلدٌ محبةٌ للسلام"],
          answer: "مصرُ بلدٌ محبةٌ للسلام",
        },
      ];

      let currentQuestion = 0;
      let score = 0;
      let timer;
      let timeLeft;
      let userAnswers = [];

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }

      function checkPassword() {
        const passwordInput = document.getElementById("password").value;
        const durationInput =
          parseInt(document.getElementById("duration").value) || 5;
        timeLeft = durationInput * 60;
        if (passwordInput === "7") {
          shuffle(questions);
          // إخفاء الهيدر ومربع الدخول
          document.getElementById("info-header").classList.add("hidden");
          document.getElementById("login-container").classList.add("hidden");
          // إظهار الكويز
          document.getElementById("quiz").classList.remove("hidden");
          loadQuestion();
          startTimer();
        } else {
          alert("🚫 كلمة السر خاطئة! الكلمة هي 7");
        }
      }

      function loadQuestion() {
        const questionContainer = document.getElementById("question-container");
        const q = questions[currentQuestion];
        questionContainer.innerHTML = `
          <h2>${q.question}</h2>
          ${q.options
            .map(
              (opt) => `
            <label style="display:block; background:white; padding:10px; margin:10px 0; border-radius:5px; cursor:pointer; border:1px solid #ddd;">
              <input type="radio" name="option" value="${opt}"> ${opt}
            </label>
          `,
            )
            .join("")}
        `;
        document.getElementById("question-info").textContent =
          `السؤال ${currentQuestion + 1} من ${questions.length}`;
      }

      function nextQuestion(event) {
        const selected = document.querySelector('input[name="option"]:checked');
        if (!selected) return alert("من فضلك اختر إجابة!");
        userAnswers[currentQuestion] = selected.value;
        if (selected.value === questions[currentQuestion].answer) score++;
        currentQuestion++;
        if (currentQuestion < questions.length) {
          loadQuestion();
        } else {
          showResults();
        }
      }

      function showResults() {
        clearInterval(timer);
        // إخفاء الكويز
        document.getElementById("quiz").classList.add("hidden");
        // إظهار الهيدر مرة أخرى في صفحة النتيجة
        document.getElementById("info-header").classList.remove("hidden");

        const res = document.getElementById("result");
        res.classList.remove("hidden");
        const percent = ((score / questions.length) * 100).toFixed(1);

        let feedbackText = "";
        if (percent >= 90) {
          feedbackText = "🌟 برافو نتيجتك حلوة جدا";
        } else if (percent >= 75) {
          feedbackText = "👏 مش بطال عاش";
        } else if (percent >= 50) {
          feedbackText = "👍 كويس.. لكن محتاج مراجعة بسيطة لتقوية نقاط ضعفك.";
        } else {
          feedbackText =
            "📚 شد حيلك شوية! راجع الإجابات تحت بتركيز وحاول تاني.";
        }

        res.innerHTML = `
          <div style="background:white; padding:20px; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.1)">
            <h2>النتيجة النهائية: ${score} من ${questions.length} (${percent}%)</h2>
            <div class="feedback-msg">${feedbackText}</div>
            <p>📸 خد سكرين شوت لنتيجتك وابعتهالنا في جروب التعليقات</p>
            <hr>
            <h3>مراجعة الإجابات:</h3>
            <ul>
              ${questions
                .map(
                  (q, i) => `
                <li>
                  <strong>س${i + 1}:</strong> ${q.question}<br>
                  إجابتك: <span class="${userAnswers[i] === q.answer ? "correct-answer" : "wrong-answer"}">${userAnswers[i] || "لم تجب"}</span><br>
                  الإجابة الصحيحة: <span class="correct-answer">${q.answer}</span>
                </li>
              `,
                )
                .join("")}
            </ul>
            <button onclick="location.reload()" style="padding:15px 30px; background:#28a745; color:white; border:none; border-radius:5px; cursor:pointer;">إعادة الاختبار</button>
          </div>
        `;
      }

      function startTimer() {
        timer = setInterval(() => {
          timeLeft--;
          let min = Math.floor(timeLeft / 60);
          let sec = timeLeft % 60;
          document.getElementById("timer").textContent =
            `${min}:${sec < 10 ? "0" : ""}${sec}`;
          if (timeLeft <= 0) showResults();
        }, 1000);
      }
    </script>
  </body>
</html>
