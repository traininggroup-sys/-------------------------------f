<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اختبار تدريبي - جروب المشتركين</title>
    <style>
      /* تعديل حاوية الكويز لتكون في المنتصف */
      #quiz {
        width: 100%;
        max-width: 600px;
        min-height: 70vh;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
      }
      @media (max-width: 600px) {
        body {
          padding: 10px;
        }

        #quiz {
          width: 100%;
          min-height: 80vh;
          margin: 0 auto;
          justify-content: center;
        }

        #question-container {
          width: 100%;
        }

        #question-container h2 {
          text-align: center;
          font-size: 25px;
          line-height: 1.7;
        }

        #quiz form {
          width: 100%;
        }

        #next-button {
          width: 100%;
          margin-top: 20px;
        }
      }
      /* إلغاء التثبيت في الزاوية وجعله تحت الأسئلة */
      #next-button {
        width: 120px;
        margin-top: 20px;
        margin-right: auto;
        margin-left: 0;
        padding: 10px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
        font-weight: bold;
        position: static;
      }

      /* تحسين شكل الخيارات عند الاختيار */
      input[type="radio"]:checked + label {
        background-color: #e7f1ff !important;
        border-color: #007bff !important;
      }
      body {
        font-family: Arial, sans-serif;
        direction: rtl;
        font-weight: 900;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        background-color: #f8f9fa;
        margin: 0;
        padding: 13px;
      }

      .header-box {
        background-color: #fff;
        border: 2px solid #28a745;
        border-radius: 15px;
        padding: 10px;
        margin-bottom: 20px;
        text-align: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      .header-box h1 {
        color: #28a745;
        font-size: 24px;
        margin-bottom: 10px;
      }
      .header-box p {
        color: #555;
        font-size: 18px;
        line-height: 1.6;
      }

      .links-container {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 15px;
        flex-wrap: wrap;
      }

      .btn-link {
        text-decoration: none;
        color: white;
        padding: 10px 20px;
        border-radius: 25px;
        font-size: 18px;
        transition: opacity 0.3s;
      }

      .tg-btn {
        background-color: #0088cc;
      }
      .fb-btn {
        background-color: #1877f2;
      }

      .hidden {
        display: none !important;
      }

      #login-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background-color: #ffffff;
        border: 2px solid #007bff;
        border-radius: 15px;
        box-shadow: 0 5px 25px rgba(0, 123, 255, 0.2);
        text-align: center;
      }

      #login-container input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
      }

      #login-container button {
        width: 100%;
        background-color: #007bff;
        color: white;
        padding: 12px 0;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      #timer {
        font-size: 20px;
        color: red;
        font-weight: bold;
      }
      #next-button {
        padding: 10px 30px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .correct-answer {
        color: green;
        font-weight: 900;
      }
      .wrong-answer {
        color: red;
        font-weight: 900;
      }

      .feedback-msg {
        font-size: 22px;
        margin: 15px 0;
        padding: 10px;
        border-radius: 10px;
        background: #f0fdf4;
        color: #166534;
        border: 1px dashed #28a745;
      }

      ul {
        list-style-type: none;
        padding: 0;
      }
      ul li {
        margin-bottom: 15px;
        background-color: #f0f4f8;
        padding: 15px;
        border-radius: 8px;
        border-right: 5px solid #007bff;
      }
    </style>
  </head>
  <body>
    <div id="info-header" class="header-box">
      <h1>🎁 هدية القناة العامة</h1>
      <p>
        هذا الاختبار هو جزء من تدريبات <b>جروب المشتركين للتدريب</b> علي اختبار
        الجهاز المركزي للتنظيم والإدارة.<br />
        تم فتحه مجاناً لجميع متابعينا. لمتابعة أحدث آراء الممتحنين والأسئلة
        يومياً، انضم إلينا عبر الروابط التالية:
      </p>
      <div class="links-container">
        <a
          href="https://www.facebook.com/share/p/1J118pxXnq/"
          class="btn-link fb-btn"
          >👥دوس هنا</a
        >
      </div>
    </div>

    <div id="login-container">
      <h2 style="margin-top: 0">بيانات الدخول</h2>
      <label>🔒 كلمة المرور (7):</label>
      <input id="password" type="password" placeholder="اكتب 7 بالانجليزي" />
      <label>⏳ مدة الاختبار (بالدقائق):</label>
      <input id="duration" type="number" value="5" min="1" />
      <button onclick="checkPassword()">🚀 ابدأ الاختبار الآن</button>
    </div>

    <div class="hidden" id="quiz">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          background: white;
          padding: 10px;
          border-radius: 10px;
          margin-bottom: 15px;
          gap: 30px;
        "
      >
        <div id="timer">5:00</div>
        <div id="question-info">السؤال 1 من 20</div>
      </div>
      <form id="quizForm">
        <div id="question-container"></div>
        <button id="next-button" onclick="nextQuestion(event)" type="button">
          التالي
        </button>
      </form>
    </div>

    <div class="hidden" id="result"></div>

    <script>
      const questions = [
        {
          question: "اختر الجملة الصحيحة:",
          options: [
            "تعلمت أختي في مدارسِ",
            "تعلمت أختي في مدارسَ المدينة",
            "تعلمت أختي في مدارسَ",
            "تعلمت أختي في مدارسُ",
          ],
          answer: "تعلمت أختي في مدارسَ",
        },
        {
          question: "الجملة الصحيحة",
          options: [
            "إن أطباءنا ماهرون",
            "إن أطباؤنا ماهرون",
            "إن أطبائنا ماهرون",
          ],
          answer: "إن أطباءنا ماهرون",
        },
        {
          question:
            "عَٰلِيَهُمۡ ثِيَابُ سُندُسٍ خُضۡرٞ وَإِسۡتَبۡرَقٞۖ وَحُلُّوٓاْ أَسَاوِرَ مِن فِضَّةٖ وَسَقَىٰهُمۡ رَبُّهُمۡ شَرَابٗا طَهُورًا، أعرب كلمة (أساور)",
          options: [
            "مفعول به منصوب وعلامة نصبه الفتحة",
            "اسم مجرور وعلامة جره الفتحة",
            "مفعول به ثان منصوب وعلامة نصبه الفتحة",
          ],
          answer: "مفعول به منصوب وعلامة نصبه الفتحة",
        },
        {
          question: "اختر الكلمة الصحيحة",
          options: ["سوءً", "سوءًا"],
          answer: "سوءًا",
        },
        {
          question: "اختر الجملة الصحيحة",
          options: [
            "لم ينجح إلا تسعة وتسعين طالبًا",
            "لم ينجح إلا تسعة وتسعون طالبًا",
            "لم بنجح إلا تسع وتسعون طالبًا",
          ],
          answer: "لم ينجح إلا تسعة وتسعين طالبًا",
        },
        {
          question: "جمع المؤنث السالم يُنصب بـ..............",
          options: ["الفتحة", "الضمة", "الكسرة"],
          answer: "الكسرة",
        },
        {
          question: "اختر الجملة الصحيحة",
          options: [
            "قابلْتُ شخصًا ذو خلق",
            "قابلْتُ شخصًا ذا خلق",
            "قابلْتُ شخصًا ذي خلق",
          ],
          answer: "قابلْتُ شخصًا ذا خلق",
        },
        {
          question: "اختر الجملة الصحيحة",
          options: [
            "ظن الطالبُ الامتحانُ سهلٌ",
            "ظن الطالبُ الامتحانَ سهلًا",
            "ظن الطالبُ الامتحانُ سهلًا",
          ],
          answer: "ظن الطالبُ الامتحانَ سهلًا",
        },
        {
          question: "اختر الجملة الصحيحة",
          options: ["أإبنك هذا؟", "أبنك هذا؟", "أابنك هذا؟"],
          answer: "أبنك هذا؟",
        },
        {
          question: "أعجبتني السماء نجومها",
          options: [
            "فعل + تاء الفاعل + مفعول به + بدل + مضاف إليه",
            "فعل + حرف (تاء التأنيث) + حرف (نون الوقاية) + مفعول به + فاعل + بدل + مضاف إليه",
          ],
          answer:
            "فعل + حرف (تاء التأنيث) + حرف (نون الوقاية) + مفعول به + فاعل + بدل + مضاف إليه",
        },
        {
          question: "أعرب كلمة (علم) في (سبحانك لا علمَ لنا)",
          options: [
            "اسم لا النافية للجنس مبني على الفتح في محل نصب",
            "اسم لا النافية للجنس مبني على الضم في محل نصب",
            "خبر لا النافية للجنس مبني على الفتح في محل نصب",
          ],
          answer: "اسم لا النافية للجنس مبني على الفتح في محل نصب",
        },
        {
          question: "أعرب كلمة رجلًا في (ظننتكَ رجلًا)",
          options: [
            "حال منصوب وعلامة نصبه الفتحة",
            "مفعول به أول وعلامة نصبه الفتحة",
            "مفعول به ثان منصوب وعلامة نصبه الفتحة",
          ],
          answer: "مفعول به ثان منصوب وعلامة نصبه الفتحة",
        },
        {
          question: "اختر الجملة الصحيحة",
          options: [
            "تبرعتُ بخمسةِ دراهمًا",
            "تبرعتُ بخمسِ دراهمٍ",
            "تبرعتُ بخمسةِ دراهمَ",
          ],
          answer: "تبرعتُ بخمسةِ دراهمَ",
        },
        {
          question: "لن يرى الطالب النتائج قبل الموعد، أعرب كلمة (يرى)",
          options: [
            "فعل مضارع منصوب بالفتحة الظاهرة",
            "فعل مضارع مرفوع بالضمة",
            "فعل مضارع منصوب بالفتحة المقدرة",
          ],
          answer: "فعل مضارع منصوب بالفتحة المقدرة",
        },
        {
          question: "أكرمت الطالبَ",
          options: ["العفيفةَ نفسُه", "العفيفةُ نفسُه"],
          answer: "العفيفةَ نفسُه",
        },
        {
          question: "اختر الإجابة الصحيحة",
          options: ["حضرَ الوفاةُ الموتى", "حضر الموتى الوفاةُ"],
          answer: "حضر الموتى الوفاةُ",
        },
        {
          question: "اختر الجملة الصحيحة من بين الجمل الآتية.",
          options: [
            "اشتريتُ القلمَ بخمسِ دراهمَ",
            "اشتريتُ القلمَ بخمسةِ درهمَ",
            "اشتريتُ القلمَ بخمسةِ دراهمَ",
          ],
          answer: "اشتريتُ القلمَ بخمسةِ دراهمَ",
        },
        {
          question: "......... صديقتَكِ هدية.",
          options: ["إهدِ", "اهدِ", "اهدي"],
          answer: "اهدي",
        },
        {
          question: "اختر الجملة الصحيحة",
          options: [
            "من يتقي الله يفوز بالجنة",
            "من يتقي الله يفز بالجنة",
            "من يتق الله يفوز بالجنة",
            "من يتقِ الله يفز بالجنة",
          ],
          answer: "من يتقِ الله يفز بالجنة",
        },
        {
          question:
            "تَلْبِسُوا الْحَقَّ بِالْبَاطِلِ وَتَكْتُمُوا الْحَقَّ وَأَنْتُمْ تَعْلَمُونَ، أعرب (تلبسوا)",
          options: [
            "فعل مضارع مجزوم بلا، وعلامة جزمه حذف النون",
            "فعل مضارع منصوب بلا، وعلامة نصبه حذف النون",
            "فعل مضارع مرفوع بلا، وعلامة رفعه الضمة",
            "فعل مضارع مرفوع بلا، وعلامة رفعه الواو",
          ],
          answer: "فعل مضارع مجزوم بلا، وعلامة جزمه حذف النون",
        },
      ];

      let currentQuestion = 0;
      let score = 0;
      let timer;
      let timeLeft;
      let userAnswers = [];

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }

      function checkPassword() {
        const passwordInput = document.getElementById("password").value;
        const durationInput =
          parseInt(document.getElementById("duration").value) || 5;
        timeLeft = durationInput * 60;
        if (passwordInput === "55") {
          shuffle(questions);
          // إخفاء الهيدر ومربع الدخول
          document.getElementById("info-header").classList.add("hidden");
          document.getElementById("login-container").classList.add("hidden");
          // إظهار الكويز
          document.getElementById("quiz").classList.remove("hidden");
          loadQuestion();
          startTimer();
        } else {
          // alert("🚫 كلمة السر خاطئة! الكلمة هي 7");
          alert(
            "⏰ وقت الاختبار انتهى!\n\nماتستناش الاختبار الجاي. انضم لجروب المشتركين واختبر نفسك في أي وقت على أهم أسئلة الجهاز المركزي.\n\nكلمنا واعرف سعر الاشتراك وابدأ مذاكرتك:\n0 11 1917 1596",
          );
        }
      }

      function loadQuestion() {
        const questionContainer = document.getElementById("question-container");
        const q = questions[currentQuestion];
        questionContainer.innerHTML = `
          <h2>${q.question}</h2>
          ${q.options
            .map(
              (opt) => `
            <label style="display:block; background:white; padding:10px; margin:10px 0; border-radius:5px; cursor:pointer; border:1px solid #ddd;">
              <input type="radio" name="option" value="${opt}"> ${opt}
            </label>
          `,
            )
            .join("")}
        `;
        document.getElementById("question-info").textContent =
          `السؤال ${currentQuestion + 1} من ${questions.length}`;
      }

      function nextQuestion(event) {
        const selected = document.querySelector('input[name="option"]:checked');
        if (!selected) return alert("من فضلك اختر إجابة!");
        userAnswers[currentQuestion] = selected.value;
        if (selected.value === questions[currentQuestion].answer) score++;
        currentQuestion++;
        if (currentQuestion < questions.length) {
          loadQuestion();
        } else {
          showResults();
        }
      }

      function showResults() {
        clearInterval(timer);
        // إخفاء الكويز
        document.getElementById("quiz").classList.add("hidden");
        // إظهار الهيدر مرة أخرى في صفحة النتيجة
        document.getElementById("info-header").classList.remove("hidden");

        const res = document.getElementById("result");
        res.classList.remove("hidden");
        const percent = ((score / questions.length) * 100).toFixed(1);

        let feedbackText = "";
        if (percent >= 90) {
          feedbackText = "🌟 برافو نتيجتك حلوة جدا";
        } else if (percent >= 75) {
          feedbackText = "👏 مش بطال عاش";
        } else if (percent >= 50) {
          feedbackText = "👍 كويس.. لكن محتاج مراجعة بسيطة لتقوية نقاط ضعفك.";
        } else {
          feedbackText =
            "📚 شد حيلك شوية! راجع الإجابات تحت بتركيز وحاول تاني.";
        }

        res.innerHTML = `
          <div style="background:white; padding:20px; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.1)">
            <h2>النتيجة النهائية: ${score} من ${questions.length} (${percent}%)</h2>
            <div class="feedback-msg">${feedbackText}</div>
            <p>📸 خد سكرين شوت لنتيجتك وابعتهالنا في جروب التعليقات</p>
            <hr>
            <h3>مراجعة الإجابات:</h3>
            <ul>
              ${questions
                .map(
                  (q, i) => `
                <li>
                  <strong>س${i + 1}:</strong> ${q.question}<br>
                  إجابتك: <span class="${userAnswers[i] === q.answer ? "correct-answer" : "wrong-answer"}">${userAnswers[i] || "لم تجب"}</span><br>
                  الإجابة الصحيحة: <span class="correct-answer">${q.answer}</span>
                </li>
              `,
                )
                .join("")}
            </ul>
            <button onclick="location.reload()" style="padding:15px 30px; background:#28a745; color:white; border:none; border-radius:5px; cursor:pointer;">إعادة الاختبار</button>
          </div>
        `;
      }

      function startTimer() {
        timer = setInterval(() => {
          timeLeft--;
          let min = Math.floor(timeLeft / 60);
          let sec = timeLeft % 60;
          document.getElementById("timer").textContent =
            `${min}:${sec < 10 ? "0" : ""}${sec}`;
          if (timeLeft <= 0) showResults();
        }, 1000);
      }
    </script>
  </body>
</html>
